[project]
name = "wolfpack-worker"
version = "0.1.0"
description = "WolfPack's mechanical trade-execution worker (paper trading only, via Alpaca)."
authors = [
    { email = "nafisuddin535@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "supabase>=2.9.0",
    "python-dotenv>=1.0.0",
    "alpaca-py>=0.44.0",
    "pandas>=3.0.6",
    # The Analyst's model runs in the daily cron, so xgboost is a main dep.
    # On Linux (CI) use the CPU-only wheel: the plain `xgboost` Linux wheel
    # pulls in nvidia-nccl (~hundreds of MB) that a CPU-only daily job never
    # uses. xgboost-cpu has no macOS wheel, so macOS dev uses plain xgboost.
    # Both ship the same `xgboost` module; pinned to the same minor version so
    # the committed model.json is read by the version that wrote it.
    "xgboost-cpu>=3.4.1,<3.5; sys_platform == 'linux'",
    "xgboost>=3.4.1,<3.5; sys_platform != 'linux'",
]

[project.scripts]
wolfpack-worker = "wolfpack_worker:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
# Only needed to train / gate The Analyst (`wolfpack_worker.analyst.train`,
# `wolfpack_worker.analyst.retrain`), not by the daily trade cron. Install
# with `uv sync --group train`. The daily cron's champion-integrity backstop
# (model_io.load_champion) reads gate_log.jsonl as plain JSON and does NOT
# import alphagate, so alphagate stays out of the main dependencies.
train = [
    "mlflow>=3.0",
    "scikit-learn>=1.5",
    "alphagate @ git+https://github.com/nafisuddinn/alphagate.git@v0.2.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
