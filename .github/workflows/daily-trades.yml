name: Daily Trade Execution

on:
  schedule:
    - cron: "0 21 * * *" # 4 PM ET (21:00 UTC)
  workflow_dispatch: # also allows manual trigger

jobs:
  execute_trades:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Run daily trades
        run: |
          pip install anthropic
          python -c "
          import subprocess
          import json
          cmd = '''claude -p \"
          Read CLAUDE.md and execute the daily trade-execution task from the backlog.
          Run the Python worker that places trades for each persona.
          Log all trades to the database.
          Write rationales for each trade using the documentarian agent.
          Commit results.
          \"'''
          subprocess.run(cmd, shell=True)
          "
