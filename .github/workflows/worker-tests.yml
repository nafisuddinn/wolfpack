name: Worker tests

# Runs the worker's full test suite (including the gate-log / registration
# consistency checks and model-card drift checks) on every PR and on pushes to
# main, plus an append-only check on the gate and forward logs of both The
# Analyst and The Scout (LOG_PATHS in wolfpack_worker/analyst/log_guard.py).
# No credentials: the tests use synthetic data and the committed model/log
# files only, never Alpaca or Supabase.
#
# The `train` dependency group depends on
#   alphagate @ git+https://github.com/nafisuddinn/alphagate.git@v0.2.0
# and uv.lock pins that tag to commit 879b10df00acb76c9f48c91c7fb49b368badd599.
# That requires the alphagate repo to stay public and the v0.2.0 tag to stay at
# that exact commit. No local-path or vendored workaround.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the append-only check can read the base branch's
          # (or the previous push's) copy of the logs.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          python-version: "3.13"

      # Fails if any gate_log.jsonl or forward_log.jsonl under
      # worker/models/analyst/ or worker/models/scout/ (LOG_PATHS in
      # wolfpack_worker/analyst/log_guard.py) on the base is not a byte-prefix
      # of this version: logged decisions (including rejected challengers) may
      # only ever be appended to.
      # PR: compare with the base branch. Push to main: compare with the
      # commit before the push (skipped if that is all zeros, i.e. a new
      # branch). Manual run: skipped.
      - name: Gate and forward logs are append-only
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE="$BEFORE_SHA"
          else
            BASE=""
          fi
          uv run --project worker --locked python -m wolfpack_worker.analyst.log_guard --base "$BASE"

      # --locked: fail if uv.lock is out of date with pyproject.toml instead
      # of silently re-resolving. The `train` group (mlflow, scikit-learn,
      # alphagate) is needed by the gate / training tests.
      - name: Run worker test suite
        run: uv run --project worker --group train --locked pytest worker/tests -q
